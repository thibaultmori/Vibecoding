/* ---------- Toasts ---------- */

function toast(msg, kind){
  const el = document.createElement('div');
  el.className = 'toast'+(kind?' '+kind:'');
  el.textContent = msg;
  $('#toast-zone').appendChild(el);
  setTimeout(()=>el.remove(), 3600);
}

/* ---------- Export / import ---------- */

function exportJSON(){ return JSON.stringify(Object.assign({}, state, {appVersion:APP_VERSION}), null, 2); }

function markExported(){ state.lastExportAt = new Date().toISOString(); saveState(); }

/* Compare '1.2.3' à APP_VERSION ; vrai si a > b */
function versionGt(a, b){
  const pa = String(a||'').split('.').map(n=>parseInt(n,10)||0);
  const pb = String(b||'').split('.').map(n=>parseInt(n,10)||0);
  for(let i=0; i<3; i++){ if((pa[i]||0)!==(pb[i]||0)) return (pa[i]||0)>(pb[i]||0); }
  return false;
}

async function downloadExport(){
  let data;
  const filename = 'passerelle-mee-'+todayISO()+'.json';
  if(serverMode){
    try{
      const r = await fetch('/api/export', {headers:{Accept:'application/json'}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      data = await r.text();
    }catch(e){ toast('Export serveur impossible : '+e.message,'crit'); return; }
  }else{
    data = exportJSON();
  }
  /* Hébergée en Artifact claude.ai, la page passe par la capacité « downloads » */
  const dl = (window.claude && typeof window.claude.use==='function')
    ? await window.claude.use('downloads').catch(()=>null) : null;
  if(dl){
    try{ await dl.save({filename, data}); markExported(); toast('Export enregistré','good'); }
    catch(e){
      if(e && e.code==='declined') toast('Enregistrement annulé');
      else toast('Enregistrement impossible — utilisez « Copier le JSON »','crit');
    }
    return;
  }
  try{
    const blob = new Blob([data], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    markExported();
    toast('Export téléchargé');
  }catch(e){ toast('Téléchargement impossible ici — utilisez « Copier le JSON »','crit'); }
}

async function copyExport(){
  let txt;
  if(serverMode){
    try{
      const r = await fetch('/api/export', {headers:{Accept:'application/json'}});
      txt = await r.text();
    }catch(e){ toast('Export serveur impossible : '+e.message,'crit'); return; }
  }else{
    txt = exportJSON();
  }
  const done = ()=>{ markExported(); toast('JSON copié dans le presse-papier','good'); };
  const fail = ()=>{ const ta=$('#io-area'); if(ta){ta.value=txt; ta.select();} toast('Copie automatique refusée : le JSON est dans la zone de texte','crit'); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fail);
  else fail();
}

function importData(txt){
  let s;
  try{ s = JSON.parse(txt); }catch(e){ toast('JSON invalide','crit'); return; }
  if(!s || typeof s!=='object' || !Array.isArray(s.platforms) || !Array.isArray(s.teams)){ toast('Format inattendu : export Passerelle requis','crit'); return; }
  if(serverMode){
    if(!isAdmin()){ toast('Import : réservé aux administrateurs.','crit'); return; }
    if(!confirm('Importer ces données dans le référentiel PARTAGÉ ? Tout le contenu actuel sera remplacé (sauvegarde serveur prise avant).')) return;
    api('/api/import', {method:'POST', body:s})
      .then(r=>loadServerState().then(()=>{ render(); toast('Données importées : '+r.platforms+' plateforme'+(r.platforms>1?'s':''),'good'); }))
      .catch(e=>toast('Import impossible : '+e.message,'crit'));
    return;
  }
  const newer = s.appVersion && versionGt(s.appVersion, APP_VERSION);
  makeBackup('avant import');
  try{ state = normalizeState(s); }
  catch(e){ toast('Import impossible : données trop corrompues ('+e.message+')','crit'); return; }
  saveState(); render();
  toast('Données importées : '+state.platforms.length+' plateforme'+(state.platforms.length>1?'s':''),'good');
  if(newer) toast('Attention : cet export vient d’une version plus récente de Passerelle ('+s.appVersion+' > '+APP_VERSION+') — certains champs ont pu être ignorés.','crit');
}

      p.gonogo = {decision:null, date:'', comment:''};
      saveState(); render(); return;
    }
    if(a==='set-stage' && p){ setStage(p, actEl.dataset.stage); return; }
    if(a==='next-stage' && p){
      const i = stageIdx(p.stage);
      if(i < STAGES.length-1) setStage(p, STAGES[i+1].id);

    }
    if(a==='hide-seed-banner'){ state.seedBannerHidden = true; saveState(); render(); return; }
    if(a==='load-demo'){
      if(serverMode){
        const seed = buildSeed();

        state.teams = seed.teams;
        normalizeState(state);
        saveState(); render(); toast('Démonstration chargée dans le référentiel partagé','good');
      }else{
        state = buildSeed(); saveState(); render(); toast('Démonstration chargée','good');
      }
      return;
    }
    if(a==='reset-demo'){
      if(serverMode){
        if(!isAdmin()){ toast('Réservé aux administrateurs.','crit'); return; }
        if(!confirm('Remplacer TOUT le référentiel partagé par le jeu de démonstration ? (sauvegarde serveur prise avant)')) return;
        const seed = buildSeed();
        api('/api/import', {method:'POST', body:{version:1, platforms:seed.platforms, teams:seed.teams,
            settings:seed.settings, integrations:seed.integrations}})
          .then(()=>loadServerState()).then(()=>{ render(); toast('Démonstration rechargée','good'); })
          .catch(e=>toast('Échec : '+e.message,'crit'));
        return;
      }
      if(confirm('Remplacer toutes les données par le jeu de démonstration ? (une sauvegarde locale est prise avant)')){

    }

        if(!isAdmin()){ toast('Réservé aux administrateurs.','crit'); return; }
        if(!confirm('Effacer TOUT le référentiel partagé ? Une sauvegarde serveur est prise avant.')) return;
        api('/api/import', {method:'POST', body:{version:1, platforms:[], teams:seedTeams(),

          .then(()=>loadServerState()).then(()=>{ location.hash='#/tableau-de-bord'; render(); toast('Référentiel effacé'); })
          .catch(e=>toast('Échec : '+e.message,'crit'));
        return;
      }
      if(confirm('Effacer toutes les données ? Une sauvegarde locale est prise avant (Paramètres → Sauvegardes), mais pensez aussi à exporter.')){
        makeBackup('avant effacement');
        state = blankState();
        state.teams = seedTeams();
        saveState(); location.hash='#/tableau-de-bord'; render(); toast('Données effacées');
      }

      if(!isAdmin()){ toast('Réservé aux administrateurs.','crit'); return; }

        .then(()=>toast('Sauvegarde serveur créée','good'))

document.addEventListener('submit', e=>{
  const f = e.target.closest('form[data-submit]');
  if(!f) return;
  e.preventDefault();
  const kind = f.dataset.submit;
  if(kind!=='dmex-search' && !canWrite()){
    toast('Lecture seule : votre rôle ne permet pas de modifier.','crit');
    return;
  }
  const fd = new FormData(f);
  const val = n => String(fd.get(n)||'').trim();

  if(kind==='form-platform'){
    if(f.dataset.id){
      const p = state.platforms.find(x=>x.id===f.dataset.id);
      if(!p) return;
      Object.assign(p, {name:val('name'), type:val('type'), criticality:val('criticality'),
        owner:val('owner'), sponsor:val('sponsor'), targetDate:val('targetDate'),
        goLiveDate:val('goLiveDate'), description:val('description')});
      logJ(p, 'Fiche modifiée.');
      closeModal(); saveState(); render(); toast('Modifications enregistrées','good');
    }else{
      const p = newPlatform({name:val('name'), type:val('type'), criticality:val('criticality'),
        owner:val('owner'), sponsor:val('sponsor'), targetDate:val('targetDate'),
        goLiveDate:val('goLiveDate'), description:val('description')});
      logJ(p, 'Fiche créée.');
      state.platforms.push(p);
      state.seeded = false; /* données réelles présentes : le bandeau démo disparaît */
      closeModal(); saveState();
      location.hash = '#/plateforme/'+p.id;
      render(); toast('Plateforme créée : checklist initialisée ('+p.checklist.length+' éléments)','good');
    }
  }
  if(kind==='form-team'){
    if(f.dataset.id){
      const t = state.teams.find(x=>x.id===f.dataset.id);
      if(t) Object.assign(t, {name:val('name'), lead:val('lead'), contact:val('contact')});
    }else{
      state.teams.push({id:uid('t'), name:val('name'), lead:val('lead'), contact:val('contact')});
    }
    closeModal(); saveState(); render(); toast('Équipe enregistrée','good');
  }
  if(kind==='form-item'){
    const p = state.platforms.find(x=>x.id===f.dataset.id);
    if(p){
      p.checklist.push({id:'custom.'+uid(''), cat:f.dataset.cat, label:val('label'),
        status:'todo', team:val('team'), due:val('due'), comment:''});
      ui.catOpen[p.id+':'+f.dataset.cat] = true;
      closeModal(); saveState(); render(); toast('Élément ajouté');
    }
  }
  if(kind==='form-action'){
    const p = state.platforms.find(x=>x.id===f.dataset.id);
    if(p){
      const blocking = fd.get('blocking')!==null;
      p.actions.push({id:uid('a'), label:val('label'), due:val('due'), blocking, done:false});
      if(blocking) logJ(p, 'Action bloquante ajoutée : '+val('label'));
      closeModal(); saveState(); render(); toast('Action ajoutée');
    }
  }
  if(kind==='add-note'){
    const p = state.platforms.find(x=>x.id===f.dataset.id);
    const note = val('note');
    if(p && note){ logJ(p, note); saveState(); render(); }
  }
  if(kind==='add-dmex'){
    const p = state.platforms.find(x=>x.id===f.dataset.id);
    if(!p) return;
    const r = parsePageId(val('url'));
    if(r.error){ toast(r.error,'crit'); return; }
    if(p.dmexPages.some(d=>String(d.id)===r.id)){ toast('Cette page est déjà rattachée'); return; }
    p.dmexPages.push({url:r.url, id:r.id});
    logJ(p, 'Page DMEX rattachée (id '+r.id+').');
    saveState(); render();
    toast('Page ajoutée — synchronisez pour récupérer ses informations');
  }
  if(kind==='dmex-search'){
    const p = state.platforms.find(x=>x.id===f.dataset.id);
    if(p) runDmexSearch(p, val('q'));
  }
});

    if(k==='item-comment' && it){ it.comment = el.value.trim(); ui.comments[p.id+':'+it.id]=false; saveState(); render(); }
    if(k==='toggle-action'){
      const a = p.actions.find(x=>x.id===el.dataset.act);
      if(a){
        a.done = el.checked;
        if(a.blocking) logJ(p, (a.done?'Action bloquante levée : ':'Action bloquante rouverte : ')+a.label);
        saveState(); render();
      }
    }
  }
});

/* Recherche : rendu à la saisie, focus conservé */
document.addEventListener('input', e=>{
  const el = e.target.closest('[data-input="search"]');
  if(!el) return;
  ui.q = el.value;
  ui.refocus = {sel:'#f-search'};
  render();
});

/* Import par fichier */
document.addEventListener('change', e=>{
  if(e.target && e.target.id==='import-file' && e.target.files && e.target.files[0]){
    const r = new FileReader();
    r.onload = ()=>{ const ta=$('#io-area'); if(ta) ta.value = String(r.result||''); toast('Fichier chargé — vérifiez puis cliquez sur « Importer »'); };
    r.readAsText(e.target.files[0]);
    e.target.value='';
  }
});

document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
});

window.addEventListener('hashchange', render);

/* Multi-onglets (mode local) : si un autre onglet écrit l'état, on le recharge au lieu de l'écraser */
window.addEventListener('storage', e=>{
  if(serverMode) return; /* en mode serveur, le SSE fait ce travail */
  if(e.key !== LS_KEY || suppressStorageEvent || e.newValue == null) return;
  const fresh = loadState();
  if(!fresh) return;
  state = normalizeState(fresh);
  render();
  toast('Données mises à jour depuis un autre onglet');
});

/* ---------- Démarrage ---------- */

(async function boot(){
  try{ localStorage.setItem('__pmee_test','1'); localStorage.removeItem('__pmee_test'); }
  catch(e){ storageOk = false; }
  /* Sonde le backend : servie par server.py, la page bascule en mode partagé */
  try{
    const ctrl = new AbortController();
    const t = setTimeout(()=>ctrl.abort(), 2500);
    const r = await fetch('/api/me', {headers:{Accept:'application/json'}, signal:ctrl.signal});
    clearTimeout(t);
    if(r.ok){
      const m = await r.json();
      if(m && m.app==='passerelle' && m.email){ me = m; serverMode = true; }
    }
  }catch(e){}
  if(serverMode){
    state = blankState();
    try{ await loadServerState(); }
    catch(e){ toast('Chargement du référentiel impossible : '+e.message, 'crit'); }
    startSSE();
  }else{
    state = loadState();
    if(!state){
      state = buildSeed();
      saveState();
    }
    normalizeState(state);
  }
  render();
})();
</script>
